name: yiweilife quality gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install production-build smoke browser
        run: npx playwright install --with-deps chromium

      - name: Run the same gate used before production
        run: bash scripts/yiweilife-quality-gate.sh --full
