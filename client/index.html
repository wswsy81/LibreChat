    <!-- 人生设计室 · 四种笔迹(见 DESIGN.md):宋体=判断 黑体=正文 文楷=人的声音 Plex Mono=数字证据

    <!-- 产品分析:自建 Umami(analytics.yiweilife.com)。自动跟踪页面/路由;
         自定义事件用 window.umami.track()(见 utils/track.ts)。只记行为不记内容。
         before-send 是隐私边界:分享 token、报告/会话 ID、query/hash 永不离开浏览器。 -->
    <script id="life-analytics-sanitizer">
      (function () {
        function sanitizeAnalyticsUrl(raw) {
          if (typeof raw !== 'string' || !raw) {
            return raw;
          }
          try {
            var base =
              window.location && window.location.origin
                ? window.location.origin
                : 'https://yiweilife.com';
            var value = new URL(raw, base);
            var pathname = value.pathname;
            if (/^\/s\/archive\/[^/]+(?:\/.*)?$/.test(pathname)) {
              pathname = '/s/archive/:token';
            } else if (/^\/archive\/reports\/[^/]+(?:\/.*)?$/.test(pathname)) {
              pathname = '/archive/reports/:reportId';
            } else if (/^\/share\/[^/]+(?:\/.*)?$/.test(pathname)) {
              pathname = '/share/:shareId';
            } else if (/^\/c\/[^/]+(?:\/.*)?$/.test(pathname)) {
              pathname = '/c/:conversationId';
            }
            value.pathname = pathname;
            value.search = '';
            value.hash = '';
            return value.origin + value.pathname;
          } catch (error) {
            return '';
          }
        }

        window.lifeAnalyticsBeforeSend = function (_type, payload) {
          if (!payload || typeof payload !== 'object') {
            return payload;
          }
          var sanitized = Object.assign({}, payload);
          if (typeof sanitized.url === 'string') {
            sanitized.url = sanitizeAnalyticsUrl(sanitized.url);
          }
          if (typeof sanitized.referrer === 'string') {
            sanitized.referrer = sanitizeAnalyticsUrl(sanitized.referrer);
          }
          return sanitized;
        };
      })();
    </script>
    <script
      defer
      src="https://analytics.yiweilife.com/script.js"
      data-website-id="be747120-ddec-4bc5-ae2d-00eeee255ee0"
      data-before-send="lifeAnalyticsBeforeSend"
      data-exclude-search="true"
      data-exclude-hash="true"
    ></script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#F2EFE6';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#F2EFE6';
      } else {
        backgroundColor = '#F2EFE6';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
        #loading-label {
          color: #5a544b;
          font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
          font-size: 14px;
          letter-spacing: 0.18em;
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script>
      window.__LC_BUILD_ID__ = '__LC_BUILD_ID_VALUE__';

      (function () {
        var KEY = 'lc-asset-recovery-at';
        var RUM_QUEUE_KEY = 'lc-rum-queue';
        var MAX_RUM_QUEUE = 20;
        window.__lcRumRecoveryGuardInstalled = true;
        window.__lcRumQueue = Array.isArray(window.__lcRumQueue) ? window.__lcRumQueue : [];
        try {
          var persistedQueue = JSON.parse(sessionStorage.getItem(RUM_QUEUE_KEY) || '[]');
          if (Array.isArray(persistedQueue)) {
            window.__lcRumQueue = persistedQueue.concat(window.__lcRumQueue).slice(-MAX_RUM_QUEUE);
          }
        } catch (e) {
          /* Diagnostics should never affect application startup. */
        }
        window.__lcRumPush = function (type, attributes) {
          try {
            var safeAttributes = {};
            Object.keys(attributes || {}).forEach(function (key) {
              var value = attributes[key];
              if (
                typeof value !== 'string' &&
                typeof value !== 'number' &&
                typeof value !== 'boolean'
              ) {
                return;
              }
              safeAttributes[key] = value;
            });
            if (window.__lcRumQueue.length >= MAX_RUM_QUEUE) {
              window.__lcRumQueue.shift();
            }
            window.__lcRumQueue.push({
              type: type,
              at: Math.round(performance.now()),
              visibilityState: document.visibilityState,
              attributes: safeAttributes,
            });
            sessionStorage.setItem(RUM_QUEUE_KEY, JSON.stringify(window.__lcRumQueue));
          } catch (e) {
            /* Diagnostics should never affect application startup. */
          }
        };
        function shouldRecover() {
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last < 60000) {
              return false;
            }
            sessionStorage.setItem(KEY, String(Date.now()));
            return true;
          } catch (e) {
            return false;
          }
        }
        window.__lcRecoverStaleAssets = function () {
          if (!shouldRecover()) {
            return false;
          }
          window.__lcRumPush('stale-asset-recovery-start');
          var reload = function () {
            window.__lcRumPush('stale-asset-recovery-reload');
            window.location.reload();
          };
          if (navigator.serviceWorker) {
            var scopeBase = new URL('./', document.baseURI || window.location.href).href;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(
                  registrations
                    .filter(function (registration) {
                      return registration.scope.indexOf(scopeBase) === 0;
                    })
                    .map(function (registration) {
                      return registration.unregister();
                    }),
                );
              })
              .then(reload, reload);
          } else {
            reload();
          }
          return true;
        };
        if (navigator.serviceWorker) {
          var lastWorkerUpdateAt = 0;
          var requestWorkerUpdate = function () {
            if (document.visibilityState === 'hidden' || Date.now() - lastWorkerUpdateAt < 60000) {
              return;
            }
            lastWorkerUpdateAt = Date.now();
            navigator.serviceWorker
              .getRegistration()
              .then(function (registration) {
                if (registration) {
                  return registration.update();
                }
              })
              .catch(function () {
                /* The existing asset recovery remains the fail-closed path. */
              });
          };
          navigator.serviceWorker.addEventListener('message', function (event) {
            if (!event.data || event.data.type !== 'LC_SW_PING') {
              return;
            }
            var source = event.source || navigator.serviceWorker.controller;
            if (source) {
              source.postMessage({
                type: 'LC_SW_PONG',
                buildId: window.__LC_BUILD_ID__,
              });
            }
          });
          window.addEventListener('focus', requestWorkerUpdate);
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              requestWorkerUpdate();
            }
          });
          window.setInterval(requestWorkerUpdate, 5 * 60 * 1000);
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) {
              return;
            }
            var failedScript = el.tagName === 'SCRIPT' && el.src;
            var failedPreload =
              el.tagName === 'LINK' && /preload/.test(el.rel || '') && /\.js$/.test(el.href || '');
            if (failedScript || failedPreload) {
              var isRumBootstrap = el.getAttribute('data-lc-rum-bootstrap') === 'true';
              window.__lcRumPush('asset-load-error', {
                tagName: el.tagName,
                assetUrl: el.src || el.href,
                optional: isRumBootstrap,
              });
              if (isRumBootstrap) {
                return;
              }
              window.__lcRecoverStaleAssets();
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var message = event.reason && event.reason.message;
          if (
            typeof message === 'string' &&
            (message.indexOf('dynamically imported module') !== -1 ||
              message.indexOf('Importing a module script failed') !== -1)
          ) {
            window.__lcRumPush('dynamic-import-error');
            window.__lcRecoverStaleAssets();
          }
        });

        // Route-level lazy imports replace the initial loading node with an empty React
        // fallback. Some import failures do not surface as a resource or preload event,
        // leaving an existing client as a featureless white page. Give that state one
        // bounded recovery attempt, then leave a visible retry control instead of silence.
        window.setTimeout(function () {
          var root = document.getElementById('root');
          var routeFallback = root && root.querySelector('[data-lc-route-fallback="true"]');
          if (!root || (!routeFallback && String(root.textContent || '').trim())) {
            return;
          }
          if (window.__lcRecoverStaleAssets()) {
            return;
          }
          root.innerHTML =
            '<div id="loading-container" role="alert"><div><span id="loading-label">页面没有成功加载</span><button type="button" id="reload-page">重新加载</button></div></div>';
          var retry = document.getElementById('reload-page');
          if (retry) {
            retry.addEventListener('click', function () {
              window.location.reload();
            });
          }
        }, 10000);
      })();
    </script>
    <script
      data-lc-rum-bootstrap="true"
      type="module"
      src="/src/lib/rum/bootstrap-entry.js"
    ></script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container" role="status" aria-live="polite">
        <span id="loading-label">人生设计室</span>
      </div>
    </div>
  </body>
</html>
