# 未来线 · 生产编排(腾讯首尔 x64)
# 自包含四件套:mongodb + future-engine(shim) + api(LibreChat) + caddy(自动 HTTPS)
# 模型层复用宿主已有的 new-api(:3000),经 host.docker.internal 连,不在此编排内。
#
# 发布与起停:
#   bash deploy/build-release.sh <release-id>
#   bash deploy/apply-release.sh .releases/<release-id>.env
#   bash deploy/compose.sh ps|logs|down
# 详见 deploy/RELEASE.md；禁止绕过 release env 直接用浮动 tag 起业务容器。
#
# 前置:.env 已生成(见 deploy/gen-secrets.sh)、DNS 域名 A 记录已指向本机、安全组放行 80/443。

services:
  mongodb:
    # 生产运行镜像全部固定到当前已验收 digest，禁止 tag 漂移。
    image: mongo@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    container_name: chat-mongodb
    restart: always
    volumes:
      - ./data-node:/data/db # 账号/对话/消息,持久化,务必进备份
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ['mongod', '--auth', '--bind_ip_all']
    networks:
      - trusted-data
    # 不发布端口,只在内网,绝不公网

  future-engine:
    # deploy/build-release.sh 先离线构建，compose 只接受内容寻址的本地 image ID。
    image: ${FUTURE_ENGINE_RELEASE_IMAGE:?Run deploy/build-release.sh first}
    pull_policy: never
    container_name: future-engine
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      - SHIM_PORT=8899
      - CHAT_URL=https://${DOMAIN} # 报告链接 APP_BASE 用它,必须是公网 https 域名
      - FUTURE_ENGINE_INTERNAL_TOKEN=${FUTURE_ENGINE_INTERNAL_TOKEN}
      - FUTURE_ENGINE_IDENTITY_SECRET=${FUTURE_ENGINE_IDENTITY_SECRET}
      - ADVISOR_GATEWAY_ENABLED=on
      - ADVISOR_CONTRACT_V3=${ADVISOR_CONTRACT_V3:-0}
      - ADVISOR_STREAM_ENABLED=${ADVISOR_STREAM_ENABLED:-0}
      - REVEAL_ARC_ENABLED=${REVEAL_ARC_ENABLED:-0}
      - ADVISOR_GATEWAY_API_KEY=${ADVISOR_GATEWAY_API_KEY}
      - ADVISOR_MAIN_MODEL=gpt-5.6-sol
      - ADVISOR_OBSERVER_MODEL=gpt-5.6-sol
      - ADVISOR_EMERGENCY_RESOURCES_JSON=${ADVISOR_EMERGENCY_RESOURCES_JSON:-[]}
      - MONGO_URI=mongodb://librechat:${MONGO_APP_PASSWORD}@mongodb:27017/LibreChat?authSource=LibreChat
      - POLARIS_URL=http://host.docker.internal:3000/v1 # 宿主 new-api
      - POLARIS_KEY=${POLARIS_KEY}
      - ADVISOR_BANKS_DIR=/app/banks-live # 话术库热更新目录,scripts/deploy-banks.sh 推送,改文案不重建镜像
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../future-engine-shim/data:/app/data # 画像/报告/邀请码,持久化,务必进备份
      - ../future-engine-shim/banks-live:/app/banks-live:ro # 话术库热更新(只读),bank-loader 按 mtime 失效
    networks:
      trusted-data: {}
      engine-egress:
        gw_priority: 1
    # 不发布 8899,只在内网

  api:
    # 自定义代码、配置和四份 dist 全部在同一 release image 内，切换只认 image ID。
    image: ${LIBRECHAT_RELEASE_IMAGE:?Run deploy/build-release.sh first}
    pull_policy: never
    container_name: LibreChat
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mongodb
      - future-engine
    env_file:
      - .env
    environment:
      # 清空 host 透传的代理,避免容器出网全 Connection error(同 dev override)
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - PROXY=
      - no_proxy=localhost,127.0.0.1,::1,mongodb,chat-mongodb,future-engine
      - NO_PROXY=localhost,127.0.0.1,::1,mongodb,chat-mongodb,future-engine
      - FUTURE_ENGINE_URL=http://future-engine:8899
      - FUTURE_ENGINE_INTERNAL_TOKEN=${FUTURE_ENGINE_INTERNAL_TOKEN}
      - FUTURE_ENGINE_IDENTITY_SECRET=${FUTURE_ENGINE_IDENTITY_SECRET}
      - ADVISOR_GATEWAY_API_KEY=${ADVISOR_GATEWAY_API_KEY}
      - MONGO_URI=mongodb://librechat:${MONGO_APP_PASSWORD}@mongodb:27017/LibreChat?authSource=LibreChat
    volumes:
      # 只保留用户产生的可写数据；代码/config/dist 不再从宿主覆盖。
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./images:/app/client/public/images
    networks:
      trusted-data: {}
      edge:
        gw_priority: 1
    # 不发布 3080,Caddy 内网反代

  # 产品分析:Umami(自建,数据留本机)。漏斗/留存/路径/仪表盘全用它原生。
  umami-db:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: umami-db
    restart: always
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - ./umami-db-data:/var/lib/postgresql/data
    networks:
      - analytics-data

  umami:
    image: ghcr.io/umami-software/umami@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
    container_name: umami
    restart: always
    depends_on:
      - umami-db
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET}
    networks:
      analytics-data: {}
      edge:
        gw_priority: 1
    # 不发布端口,Caddy 内网反代到 analytics 子域

  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: future-caddy
    restart: always
    depends_on:
      - api
      - umami
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN}
      - ANALYTICS_DOMAIN=${ANALYTICS_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 证书,别丢(丢了会重新签,有速率限制)
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    driver: bridge
  trusted-data:
    internal: true
    driver: bridge
  analytics-data:
    internal: true
    driver: bridge
  engine-egress:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
